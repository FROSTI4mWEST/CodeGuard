services:
  - type: web
    name: codeguard
    runtime: node
    plan: free
    # NODE_ENV is production at runtime, but this build still needs Vite and esbuild.
    buildCommand: npm ci --include=dev && npm run build && test -f dist/server.cjs
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
